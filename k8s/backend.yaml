apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: adwaitpatkhedkar/scheduler-backend:v14
        ports:
        - containerPort: 8081
        env:
        - name: DB_URL
          value: jdbc:postgresql://postgres-service:5432/meeting_scheduler
        - name: DB_USERNAME
          value: scheduler_user
        - name: DB_PASSWORD
          value: scheduler_password
        - name: SERVER_PORT
          value: "8081"
        - name: JWT_SECRET
          value: mysecret123
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - port: 8081
      targetPort: 8081
