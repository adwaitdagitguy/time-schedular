---
- name: Provision EC2 for Time Scheduler (Minikube + Jenkins + SonarQube)
  hosts: scheduler
  become: true

  vars:
    minikube_version: "v1.33.1"
    kubectl_version: "v1.30.0"

  tasks:

    # ── 1. System Update ───────────────────────────────────────────────────────
    - name: Update apt cache and upgrade packages
      apt:
        update_cache: yes
        upgrade: dist

    # ── 2. Base packages ───────────────────────────────────────────────────────
    - name: Install base packages
      apt:
        name:
          - git
          - curl
          - wget
          - unzip
          - gnupg
          - conntrack
          - socat
          - ca-certificates
          - lsb-release
          - default-jre        # needed for jenkins-cli.jar
        state: present

    # ── 3. Install Docker ──────────────────────────────────────────────────────
    - name: Install Docker via official script
      shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    # ── 4. Minikube & kubectl Binaries ────────────────────────────────────────
    - name: Download kubectl
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Download Minikube
      get_url:
        url: "https://storage.googleapis.com/minikube/releases/{{ minikube_version }}/minikube-linux-amd64"
        dest: /usr/local/bin/minikube
        mode: '0755'

    # ── 5. Start Minikube (CRITICAL: Do this before Jenkins) ──────────────────
    - name: Start Minikube with Docker driver
      become_user: ubuntu
      shell: minikube start --driver=docker --cpus=2 --memory=2200mb
      args:
        creates: /home/ubuntu/.minikube/profiles/minikube/config.json
      environment:
        HOME: /home/ubuntu

    - name: Enable Minikube ingress addon
      become_user: ubuntu
      shell: minikube addons enable ingress
      environment:
        HOME: /home/ubuntu

    - name: Fix .kube permissions for Jenkins mount
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
        recurse: yes

    # ── 6. Node.js 20 ─────────────────────────────────────────────────────────
    - name: Setup Node.js 20 repo
      shell: curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      args:
        creates: /etc/apt/sources.list.d/nodesource.list

    - name: Install Node.js
      apt:
        name: nodejs
        state: present
        update_cache: yes

    # ── 7. Build Custom Jenkins Image ─────────────────────────────────────────
    - name: Create Jenkins Dockerfile directory
      file:
        path: /opt/jenkins-docker
        state: directory
        mode: '0755'

    - name: Write custom Jenkins Dockerfile
      copy:
        dest: /opt/jenkins-docker/Dockerfile
        content: |
          FROM jenkins/jenkins:lts-jdk17
          USER root
          # Install Maven and Docker Client
          RUN apt-get update && apt-get install -y maven && \
              curl -fsSL https://get.docker.com | sh && \
              rm -rf /var/lib/apt/lists/*
          # Install kubectl
          RUN curl -fsSL https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl -o /usr/local/bin/kubectl && \
              chmod +x /usr/local/bin/kubectl
          USER jenkins
          # Bake plugins into the image (Bypasses CLI handshake errors)
          RUN jenkins-plugin-cli --plugins git workflow-aggregator sonar credentials-binding junit pipeline-utility-steps ws-cleanup pipeline-stage-view

    - name: Build custom Jenkins Docker image
      shell: docker build -t jenkins-custom:latest /opt/jenkins-docker
      register: jenkins_build
      changed_when: "'Successfully built' in jenkins_build.stdout"

    - name: Create Jenkins init script directory on host
      file:
        path: /opt/jenkins-init
        state: directory
        mode: '0755'

    - name: Write Jenkins URL init script
      copy:
        dest: /opt/jenkins-init/set-url.groovy
        content: |
          import jenkins.model.*
          def j = Jenkins.instance
          def loc = j.getDescriptor("jenkins.model.JenkinsLocationConfiguration")
          loc.setUrl("http://{{ ansible_host }}:8080/")
          loc.save()
          j.save()
        mode: '0644'

    # ── 8. Jenkins systemd service ────────────────────────────────────────────
    - name: Create Jenkins systemd service
      copy:
        dest: /etc/systemd/system/jenkins.service
        content: |
          [Unit]
          Description=Jenkins CI (Docker)
          After=docker.service
          Requires=docker.service

          [Service]
          Type=simple
          Restart=always
          RestartSec=10
          ExecStartPre=-/usr/bin/docker rm -f jenkins
          ExecStart=/usr/bin/docker run --rm \
            --name jenkins \
            -p 8080:8080 \
            -p 50000:50000 \
            -e JAVA_OPTS="-Djenkins.install.runSetupWizard=false" \
            -v jenkins_home:/var/jenkins_home \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /home/ubuntu/.kube:/var/jenkins_home/.kube:ro \
            -v /opt/jenkins-init/set-url.groovy:/var/jenkins_home/init.groovy.d/set-url.groovy:ro \
            jenkins-custom:latest

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start Jenkins
      systemd:
        name: jenkins
        state: started
        enabled: yes
        daemon_reload: yes

    # ── 9. Wait for Jenkins & Install Plugins ─────────────────────────────────
    - name: Wait for Jenkins to be ready
      uri:
        url: http://localhost:8080/login
        method: GET
        status_code: 200
      register: jenkins_ready
      until: jenkins_ready.status == 200
      retries: 30
      delay: 15

    - name: Get Jenkins initial admin password
      shell: docker exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword
      register: jenkins_password_raw
      retries: 10
      delay: 10

    - name: Set jenkins_pass fact
      set_fact:
        jenkins_pass: "{{ jenkins_password_raw.stdout | trim }}"



    # ── 10. SonarQube ─────────────────────────────────────────────────────────
    - name: Set vm.max_map_count for SonarQube
      sysctl:
        name: vm.max_map_count
        value: "262144"
        state: present

    - name: Create SonarQube systemd service
      copy:
        dest: /etc/systemd/system/sonarqube.service
        content: |
          [Unit]
          Description=SonarQube Community (Docker)
          After=docker.service
          Requires=docker.service

          [Service]
          Type=simple
          Restart=always
          RestartSec=15
          ExecStartPre=-/usr/bin/docker rm -f sonarqube
          ExecStart=/usr/bin/docker run --rm \
            --name sonarqube \
            -p 9000:9000 \
            -v sonarqube_data:/opt/sonarqube/data \
            -v sonarqube_logs:/opt/sonarqube/logs \
            -v sonarqube_extensions:/opt/sonarqube/extensions \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            sonarqube:community

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start SonarQube
      systemd:
        name: sonarqube
        state: started
        enabled: yes
        daemon_reload: yes

    # ── 11. Minikube Tunnel Service ───────────────────────────────────────────
    - name: Create minikube-tunnel systemd service
      copy:
        dest: /etc/systemd/system/minikube-tunnel.service
        content: |
          [Unit]
          Description=Minikube Tunnel
          After=docker.service
          Requires=docker.service

          [Service]
          Type=simple
          User=ubuntu
          ExecStart=/usr/local/bin/minikube tunnel
          Restart=always
          RestartSec=10
          Environment="HOME=/home/ubuntu"

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start minikube-tunnel
      systemd:
        name: minikube-tunnel
        state: started
        enabled: yes
        daemon_reload: yes

    # ── 12. Final Summary ─────────────────────────────────────────────────────
    - name: Deployment summary
      debug:
        msg:
          - "================================================"
          - " Jenkins  : http://{{ ansible_host }}:8080"
          - " Password : {{ jenkins_pass }}"
          - " SonarQube: http://{{ ansible_host }}:9000  (admin / admin)"
          - " App URL  : http://{{ ansible_host }} (after pipeline runs)"
          - "================================================"
