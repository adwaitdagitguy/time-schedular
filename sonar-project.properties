sonar.projectKey=scheduler-project
sonar.projectName=SE Time Scheduler
sonar.sourceEncoding=UTF-8

# Backend (Spring Boot / Java)
sonar.java.binaries=backend/target/classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Frontend + backend sources for monorepo scanning
sonar.sources=backend/src/main/java,src
sonar.tests=backend/src/test/java

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/*.class
