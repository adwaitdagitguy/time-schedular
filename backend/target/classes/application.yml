server:
  port: 8080

spring:
  application:
    name: meeting-scheduler-backend
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meeting_scheduler}
    username: ${DB_USERNAME:scheduler_user}
    password: ${DB_PASSWORD:scheduler_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 1
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        
  security:
    jwt:
      secret: ${JWT_SECRET:mySecretKey}
      expiration: 86400000 # 24 hours

logging:
  level:
    com.meetingscheduler: DEBUG
    org.springframework.security: DEBUG
